  [[problema.signo]]
  texto = "Hormigas grandes que cargan hojas; montículos de tierra en los nidos"
  peso = 3
  claves = ["arriera", "arrieras", "monticulo", "hormiguero", "cargan hojas"]
  [[problema.signo]]
  texto = "La planta queda sin hojas de un día para otro (trabajan de noche)"
  peso = 1
  claves = ["noche", "sin hojas", "defolia", "pelada"]

