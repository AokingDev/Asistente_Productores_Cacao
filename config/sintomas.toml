  [[problema.signo]]
  texto = "Insecto rojo-amarillento con bandas negras en las mazorcas"
  peso = 3
  claves = ["chinche", "mosquilla", "mosquita", "insecto rojo", "insecto amarillo"]
  [[problema.signo]]
  texto = "Mazorcas pequeñas deformes, endurecidas o petrificadas que se caen"
  peso = 2
  claves = ["mazorcas pequenas", "frutos pequenos", "se caen", "petrificada", "endurecen", "endurecidas", "deformes"]
  [[problema.signo]]
  texto = "Más ataque cuando disminuyen las lluvias o hay poca sombra"
  peso = 1
  claves = ["epoca seca", "poca sombra", "verano"]

[[problema]]
