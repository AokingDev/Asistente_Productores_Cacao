  peso = 2
  claves = ["hojas amarillas", "amarillamiento", "marchita", "marchitas", "marchitez", "hojas secas", "arbol seco"]
  [[problema.signo]]
  texto = "Hojas color café rojizo"
  peso = 1
  claves = ["cafe rojizo", "rojizas", "rojizo"]
  [[problema.signo]]
  texto = "El árbol se muere en poco tiempo"
  peso = 1
  claves = ["muere", "murio", "muerto", "se esta muriendo"]

[[problema]]
