# Tabla de síntomas validada con los manuales (herramienta diagnosticar_sintomas).
# Cada signo cita documento y página del PDF; los textos de manejo resumen SOLO prácticas culturales
# que aparecen en esas páginas. Las claves son frases cortas en minúsculas: un signo coincide si
# TODAS las palabras de alguna clave aparecen en la descripción del productor (por raíz, sin tildes).
# peso: 3 = signo característico · 2 = signo frecuente · 1 = signo de apoyo o contexto.
#
# Revisada contra: guia_iniap pp. 34, 110-115, 119-122 · manual76 pp. 15-17.

[[problema]]
id = "moniliasis"
nombre = "Moniliasis (monilla)"
tipo = "enfermedad"
agente = "Moniliophthora roreri (hongo)"
partes = ["mazorca"]
nombres_locales = ["monilla", "monilia", "moniliasis"]
diferencial = "Si sobre la mancha aparece una felpa blanca-crema que suelta polvo con el viento, es monilla. La mazorca negra deja una mancha café oscuro sin esa felpa."
manejo_cultural = "Retire cada semana las mazorcas enfermas antes de que aparezca el polvo blanco y déjelas en el campo para que se descompongan. Regule la sombra con podas y mantenga buen drenaje."
fuentes = [{ doc = "guia_iniap", pagina = 119 }, { doc = "manual76", pagina = 16 }]
  [[problema.signo]]
  texto = "Felpa o polvo blanco-crema sobre la mancha"
  peso = 3
  claves = ["felpa", "polvo blanco", "polvillo blanco", "polvo crema", "capa blanca", "moho blanco", "algodon", "ceniza", "blanco cremoso", "blanca cremosa", "esporas", "polvo"]
  [[problema.signo]]
  texto = "Manchas pardas, amarillas o anaranjadas en la mazorca"
  peso = 2
  claves = ["mancha parda", "mancha cafe", "mancha marron", "mancha amarilla", "mancha anaranjada", "manchas"]
  [[problema.signo]]
  texto = "Granos podridos o pegados en una masa dentro de la mazorca"
  peso = 1
  claves = ["podrida por dentro", "granos podridos", "pudricion interna", "granos pegados", "masa compacta", "necrosis"]
  [[problema.signo]]
  texto = "Mazorcas pequeñas secas que quedan pegadas al árbol"
  peso = 1
  claves = ["quedan pegadas", "adheridas", "mazorcas secas"]

[[problema]]
id = "escoba_bruja"
nombre = "Escoba de bruja"
tipo = "enfermedad"
agente = "Moniliophthora perniciosa (hongo)"
partes = ["rama", "brote", "flor", "mazorca"]
nombres_locales = ["escoba de bruja", "escoba"]
diferencial = "Las escobas son brotes verdes engrosados con hojas finas y rugosas. También hay frutos deformes llamados «chirimoya» o «zanahoria». Si solo hay manchas en la mazorca, sin brotes deformes, piense en monilla o mazorca negra."
manejo_cultural = "Haga poda fitosanitaria: elimine escobas y material enfermo una o dos veces al año en época seca (la última, 3 a 4 meses antes de las lluvias) y tumbe los frutos enfermos en cada cosecha. Use clones tolerantes al renovar."
fuentes = [{ doc = "guia_iniap", pagina = 120 }, { doc = "guia_iniap", pagina = 121 }, { doc = "manual76", pagina = 16 }]
  [[problema.signo]]
  texto = "Brotes o ramas engrosados y deformes, en forma de escoba"
  peso = 3
  claves = ["escoba", "rama gruesa", "ramas gruesas", "brote grueso", "engrosado", "engrosada", "ramas deformes", "brotes deformes", "hinchada", "proliferacion", "muchas ramitas"]
  [[problema.signo]]
  texto = "Flores «estrella» o frutos deformes tipo «chirimoya» o «zanahoria»"
  peso = 3
  claves = ["chirimoya", "zanahoria", "flor estrella", "flores estrella", "frutos deformes", "mazorca deforme", "mazorcas deformes"]
  [[problema.signo]]
  texto = "Escobas secas en la parte de afuera de la copa"
  peso = 1
  claves = ["escobas secas", "secas en la copa"]
  [[problema.signo]]
  texto = "Granos endurecidos o con pudrición acuosa"
  peso = 1
  claves = ["acuosa", "granos duros"]

[[problema]]
id = "mazorca_negra"
nombre = "Mazorca negra"
tipo = "enfermedad"
agente = "Phytophthora spp. (hongo)"
partes = ["mazorca", "tronco", "hoja"]
nombres_locales = ["mazorca negra", "pudricion negra", "phytophthora"]
diferencial = "La mazorca negra deja una mancha café oscuro que se extiende, sin felpa blanca. En el tronco aparecen manchas húmedas café o vino tinto («cáncer del tronco»)."
manejo_cultural = "Retire los frutos enfermos en cada cosecha y evite el encharcamiento con buen drenaje. El exceso de sombra y la falta de poda favorecen la enfermedad."
fuentes = [{ doc = "manual76", pagina = 17 }]
  [[problema.signo]]
  texto = "Mancha café oscura o negra en la mazorca"
  peso = 3
  claves = ["mancha negra", "mazorca negra", "mazorcas negras", "cafe oscuro", "mancha oscura", "negra", "ennegrecida", "se pone negra", "se ponen negras"]
  [[problema.signo]]
  texto = "Manchas húmedas café o vino tinto en el tronco (cáncer)"
  peso = 2
  claves = ["cancer", "mancha humeda", "vino tinto"]
  [[problema.signo]]
  texto = "Hojas con manchas que empiezan por el borde y se enrollan"
  peso = 1
  claves = ["borde de la hoja", "bordes de las hojas", "se enrollan", "hojas enrolladas"]
  [[problema.signo]]
  texto = "Mazorca dura o podrida"
  peso = 1
  claves = ["dura", "duras", "podrida", "pudricion"]
  [[problema.signo]]
  texto = "Condiciones favorables: mucha sombra, encharcamiento o lluvias"
  peso = 1
  claves = ["encharca", "mucha sombra", "exceso de sombra", "mal drenaje", "lluvia", "lluvias"]

[[problema]]
