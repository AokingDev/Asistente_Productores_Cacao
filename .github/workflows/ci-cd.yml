# CI/CD del Asistente de Cacao (semana 4, misión 5)
#  · CI: en cada push y pull request → gitleaks + pytest (el modelo va SIMULADO: no hace falta ninguna clave)
#  · CD: solo en push a main, solo si las pruebas pasaron (needs: pruebas) → Cloud Run
#    El despliegue queda apagado hasta que el equipo cree el secreto GCP_SA_KEY y la variable
#    DESPLEGAR_CLOUD_RUN=true (Settings › Secrets and variables › Actions). Pasos en docs/despliegue.md §5.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # gitleaks revisa todo el historial
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'         # la misma versión de la imagen Docker
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: La imagen se construye
        run: docker build -t g9-cacao .

  desplegar:
    needs: pruebas                       # si las pruebas fallan, no se publica
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DESPLEGAR_CLOUD_RUN == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: g9-cacao
          region: us-central1
          source: .
          # Las claves y LLM_PRINCIPAL/LLM_RESPALDO NO se pasan aquí: Cloud Run conserva entre versiones
          # lo configurado en el primer despliegue (docs/despliegue.md §3).
          flags: --memory=1Gi --cpu=1 --min-instances=0 --max-instances=1 --timeout=120
      - name: Humo contra la URL nueva
        run: |
          URL=$(gcloud run services describe g9-cacao --region us-central1 --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$URL/health"
