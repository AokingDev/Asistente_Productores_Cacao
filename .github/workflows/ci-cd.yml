# CI/CD del Asistente de Cacao (semana 4, misión 5)
#  · CI: en cada push y pull request → gitleaks + pytest (el modelo va SIMULADO: no hace falta ninguna clave)
#  · CD: solo en push a main, solo si las pruebas pasaron (needs: pruebas) → Azure Container Apps
#    El despliegue queda apagado hasta que el equipo cree el secreto AZURE_CREDENTIALS y las variables
#    AZURE_ACR y DESPLEGAR_AZURE=true (Settings › Secrets and variables › Actions). Pasos en docs/despliegue.md §6.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # gitleaks revisa todo el historial
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'         # la misma versión de la imagen Docker
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: La imagen se construye
        run: docker build -t g9-cacao .

  desplegar:
    needs: pruebas                       # si las pruebas fallan, no se publica
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DESPLEGAR_AZURE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # Construye la imagen con el Dockerfile en el registro ACR y actualiza la app.
      # Las claves y LLM_PRINCIPAL/LLM_RESPALDO NO se pasan aquí: la app conserva sus secretos y variables.
      - uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ vars.AZURE_ACR }}
          containerAppName: asistente-productores-cacao
          resourceGroup: rg-g9
          targetPort: 8080
      # Pruebas funcionales de humo contra la URL desplegada, con el modelo REAL (misión 6 del taller).
      # Primero despierta la app (arranque en frío) y luego corre tests/smoke.py: si un caso falla, el job queda rojo.
      - name: Humo contra la URL nueva
        run: |
          FQDN=$(az containerapp show --name asistente-productores-cacao --resource-group rg-g9 --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://$FQDN/health"
          python3 tests/smoke.py "https://$FQDN"
